[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-research-optimizer"
version = "1.1.0"
description = "Auditable, point-in-time financial research workflow with offline artifacts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
test = ["pytest>=8.0", "jsonschema>=4.20"]
schema = ["jsonschema>=4.20"]
browser = ["patchright>=1.0"]
pdf = ["pdfplumber>=0.11"]
mcp = ["mcp>=2,<3"]

[project.scripts]
fro-preflight = "scripts.run_preflight:main"
fro-html = "scripts.generate_financial_html:main"
fro-config = "scripts.validate_research_config:main"
fro-manifest = "scripts.validate_experiment_manifest:main"
fro-source-router = "scripts.source_router:main"
fro-source-snapshot = "scripts.source_snapshot:main"
fro-source-registry = "scripts.validate_source_registry:main"
fro-build-refresh = "scripts.build_refresh_plan:main"
fro-execute-refresh = "scripts.execute_online_refresh:main"
fro-adapter-status = "scripts.adapters.status:main"
fro-mcp = "mcp_server.server:main"
fro-adapter-smoke = "scripts.run_adapter_smoke:main"
fro-certify-adapter = "scripts.certify_adapter:main"
fro-certification-cycle = "scripts.run_certification_cycle:main"
fro-validate-schemas = "scripts.validate_schemas:main"
fro-data-quality = "scripts.validate_financial_dataset:main"
fro-quality-audit = "scripts.data_quality:main"
fro-source-health = "scripts.source_health:main"
fro-maturity-report = "scripts.maturity_report:main"
fro-forecast = "scripts.forecast:main"
fro-release-gate = "scripts.release_gate:main"
fro-run-store = "financial_research.run_store_cli:main"
fro-formula-build = "scripts.tex.compile_formula:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["scripts*", "financial_research*", "mcp_server*"]
