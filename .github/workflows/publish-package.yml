name: publish-python-package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to receive the built distributions
        required: true
        default: v1.0.0

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python3 -m pip install --upgrade build twine

      - name: Build distributions
        run: python3 -m build

      - name: Attach distributions to GitHub Release
        if: ${{ github.event_name == 'release' || inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name || inputs.release_tag }}"
          gh release upload "$tag" dist/* \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Publish to PyPI when token is configured
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then
            echo "PYPI_API_TOKEN is not configured; skipping PyPI upload."
            exit 0
          fi
          TWINE_USERNAME=__token__ TWINE_PASSWORD="$PYPI_API_TOKEN" \
            python3 -m twine upload \
            --repository-url https://upload.pypi.org/legacy/ \
            dist/*

  publish-container:
    name: Publish GHCR container package
    if: ${{ github.event_name == 'release' || inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/financial-research-optimizer
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ github.event.release.tag_name || inputs.release_tag }},enable=true
            type=sha

      - name: Build and push container package
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
