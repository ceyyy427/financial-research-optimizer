name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest -q
      - name: Ruff
        run: ruff check src tests scripts
      - name: Governance and dependency checks
        run: |
          python scripts/validate_governance.py .
          python -m pip check
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.lock --strict --progress-spinner off
          python scripts/prepare_release.py --check
          python scripts/secret_scan.py
      - name: Build smoke
        run: |
          python -m pip wheel --no-deps --wheel-dir /tmp/finahinking-wheel .
          python scripts/clean_install.py --wheel "$(find /tmp/finahinking-wheel -name 'finathink-*.whl' -print -quit)"
      - name: Diff whitespace
        run: git diff --check

  quant-and-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install research and quant dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,research]' statsmodels==0.15.0
      - name: Quant dependency and SQLite migration smoke
        run: |
          python -m pip check
          python -c "import sqlite3; from finahinking.p6_5.repository import apply_migration; from finahinking.p7 import apply_p7_migration; c=sqlite3.connect(':memory:'); apply_migration(c); apply_p7_migration(c)"
          python -c "import pandas as pd; from finahinking.quant.adapters.statsmodels_adapter import StatsmodelsAdapter; print(StatsmodelsAdapter().fit_ols(pd.DataFrame({'y':[1.,2.,3.], 'x':[0.,1.,2.]}), 'y', ['x']).fingerprint)"
      - name: PostgreSQL migration gate
        run: bash scripts/verify_p6_5_postgres.sh

  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev,research]'
      - name: Notebook gate
        run: python -m jupyter nbconvert --to notebook --execute --output /tmp/finahinking_research_workflow_executed.ipynb notebooks/01_research_workflow.ipynb
