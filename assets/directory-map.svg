<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
  <title id="title">Skill directory map</title>
  <desc id="desc">Directory map showing the skill entrypoint, references, scripts, assets, and generated artifacts.</desc>
  <rect width="1120" height="440" rx="24" fill="#f8fafc"/>
  <text x="52" y="52" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">目录不是文件堆：每层对应一个任务</text>
  <g font-family="Arial, sans-serif"><rect x="52" y="94" width="300" height="284" rx="18" fill="#172033"/><text x="80" y="137" font-size="19" font-weight="700" fill="#ffffff">financial-research-optimizer/</text><text x="82" y="178" font-size="14" fill="#bfdbfe">SKILL.md</text><text x="82" y="204" font-size="12" fill="#cbd5e1">入口、路由、边界</text><text x="82" y="244" font-size="14" fill="#bfdbfe">README.md</text><text x="82" y="270" font-size="12" fill="#cbd5e1">教学与快速调用</text><text x="82" y="310" font-size="14" fill="#bfdbfe">agents/openai.yaml</text><text x="82" y="336" font-size="12" fill="#cbd5e1">界面元数据</text></g>
  <g font-family="Arial, sans-serif"><rect x="420" y="94" width="290" height="128" rx="16" fill="#dbeafe"/><text x="450" y="134" font-size="17" font-weight="700" fill="#1e3a8a">references/</text><text x="450" y="164" font-size="13" fill="#334155">来源、推导、评估</text><text x="450" y="188" font-size="13" fill="#334155">HTML 与决策表契约</text><rect x="420" y="250" width="290" height="128" rx="16" fill="#dcfce7"/><text x="450" y="290" font-size="17" font-weight="700" fill="#166534">scripts/</text><text x="450" y="320" font-size="13" fill="#334155">数据审计</text><text x="450" y="344" font-size="13" fill="#334155">HTML + 指标图生成器</text></g>
  <g font-family="Arial, sans-serif"><rect x="778" y="94" width="290" height="128" rx="16" fill="#fef3c7"/><text x="808" y="134" font-size="17" font-weight="700" fill="#92400e">assets/</text><text x="808" y="164" font-size="13" fill="#334155">HTML 预览</text><text x="808" y="188" font-size="13" fill="#334155">预测、风险、模型图</text><rect x="778" y="250" width="290" height="128" rx="16" fill="#ede9fe"/><text x="808" y="290" font-size="17" font-weight="700" fill="#5b21b6">artifacts/</text><text x="808" y="320" font-size="13" fill="#334155">analysis.json</text><text x="808" y="344" font-size="13" fill="#334155">HTML 与决策表</text></g>
  <g stroke="#94a3b8" stroke-width="3" fill="none"><path d="M352 180h60"/><path d="M352 290h60"/><path d="M710 180h60"/><path d="M710 290h60"/></g><g fill="#94a3b8"><path d="M412 180l-10-7v14z"/><path d="M412 290l-10-7v14z"/><path d="M770 180l-10-7v14z"/><path d="M770 290l-10-7v14z"/></g>
</svg>
