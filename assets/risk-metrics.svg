<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Risk and tail metrics</title>
  <desc id="desc">Realized volatility, maximum drawdown, VaR, and expected shortfall used by the decision layer.</desc>
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="54" y="42" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">风险与尾部指标</text>
  <text x="54" y="66" font-family="Arial, sans-serif" font-size="13" fill="#64748b">指标只描述当前样本和风险状态，不等于未来损失保证</text>
  <g font-family="Arial, sans-serif"><text x="80" y="126" font-size="15" fill="#334155">20日实现波动率</text><text x="80" y="194" font-size="15" fill="#334155">最大回撤</text><text x="80" y="262" font-size="15" fill="#334155">VaR 95%</text><text x="80" y="330" font-size="15" fill="#334155">ES 95%</text></g>
  <g fill="#e2e8f0"><rect x="280" y="104" width="500" height="30" rx="7"/><rect x="280" y="172" width="500" height="30" rx="7"/><rect x="280" y="240" width="500" height="30" rx="7"/><rect x="280" y="308" width="500" height="30" rx="7"/></g>
  <g fill="#f97316"><rect x="280" y="104" width="360" height="30" rx="7"/><rect x="280" y="172" width="248" height="30" rx="7"/></g>
  <g fill="#b91c1c"><rect x="280" y="240" width="300" height="30" rx="7"/><rect x="280" y="308" width="384" height="30" rx="7"/></g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#172033"><text x="804" y="126">24.0%</text><text x="804" y="194">-12.4%</text><text x="804" y="262">-3.8%</text><text x="804" y="330">-5.6%</text></g>
  <line x1="80" y1="372" x2="880" y2="372" stroke="#e2e8f0"/><text x="80" y="397" font-family="Arial, sans-serif" font-size="13" fill="#64748b">风险预算触发：波动率高于阈值时，决策表建议保持较低暴露。</text>
</svg>
