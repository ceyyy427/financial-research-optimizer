knowledge_id: calibration
title: 预测区间校准
domain: model_evaluation
level: intermediate
summary: 检查名义置信水平与实际覆盖率是否一致。
definition: "校准比较预测区间的名义覆盖概率和独立评估样本中的经验覆盖率。"
formula_tex: "\\widehat{Coverage}=T^{-1}\\sum_t 1\\{y_t\\in I_t\\}"
intuition: [保存独立区间, 检查真实值是否落入, 比较名义和经验覆盖]
interpretation: {good: "经验覆盖接近名义水平"}
failure_modes: [样本少时不稳定, 依赖独立校准窗口, 只校准覆盖不代表方向正确]
evidence_requirements: [coverage, interval_score, calibration_status]
