knowledge_id: naive_forecast
title: Naive 预测
domain: forecasting
level: beginner
summary: 直接将当前观测作为下一期预测，是时间序列比较基线。
definition: "预测不引入额外结构，只保持最后一个已知水平。"
formula_tex: "\\hat y_{t+1}=y_t"
intuition: [读取最近可用值, 将其作为预测, 与复杂模型比较]
interpretation: {use: "建立可解释基线"}
failure_modes: [跳跃或反转时误差大, 不提供趋势解释]
evidence_requirements: [last_observation, out_of_sample_error]
related: [rolling_mean]
sources: [{source_id: otexts_fpp3, locator: "https://otexts.com/fpp3/basic-steps.html"}]
