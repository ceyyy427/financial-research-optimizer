knowledge_id: mae
title: 平均绝对误差
domain: model_evaluation
level: beginner
summary: 逐期绝对误差的平均值，解释直观且不平方放大极端误差。
definition: "MAE = mean(abs(y - y_hat))。"
formula_tex: "\\operatorname{MAE}=\\frac{1}{T}\\sum_{t=1}^{T}|y_t-\\hat y_t|"
intuition: [计算逐期误差, 取绝对值, 求平均]
interpretation: {lower_is_better: true}
failure_modes: [对不同尺度序列不可直接比较, 不能反映误差方向]
evidence_requirements: [metric_value, evaluation_window]
related: [rmse]
sources: [{source_id: otexts_fpp3, locator: "https://otexts.com/fpp3/"}]
