knowledge_id: ood_detection
title: 分布外检测
domain: uncertainty
level: intermediate
summary: 判断当前输入是否偏离模型训练或评估分布。
definition: "OOD 是相似性或距离诊断，不是未来收益的概率保证。"
formula_tex: "D(x)=d(x,\\mathcal{X}_{train})"
intuition: [定义训练分布, 计算当前输入偏离, 达到阈值则降低信任]
interpretation: {ood_detected: "应降级、复核或使用基线"}
failure_modes: [阈值依赖样本, 不能识别所有结构突变, 不等同于数据错误]
evidence_requirements: [ood_status, threshold, feature_snapshot]
related: [calibration, point_in_time]
sources: [{source_id: nist_handbook, locator: "https://www.itl.nist.gov/div898/handbook/index2.htm"}]
