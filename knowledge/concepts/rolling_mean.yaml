knowledge_id: rolling_mean
title: 滚动平均预测
domain: forecasting
level: beginner
summary: 用最近窗口内观测值的平均水平预测下一期。
definition: "窗口长度 w 决定模型使用的近期信息范围。"
formula_tex: "\\hat y_{t+1}^{(w)}=\\frac{1}{w}\\sum_{i=0}^{w-1}y_{t-i}"
intuition: [选择近期窗口, 降低单个观测噪声, 预测局部水平]
interpretation: {larger_window: "更平滑但反应更慢", smaller_window: "更敏感但更不稳定"}
failure_modes: [快速反转时滞后, 窗口敏感, 结构变化时失效]
evidence_requirements: [window_length, rolling_evaluation]
related: [naive_forecast, expanding_window]
sources: [{source_id: otexts_fpp3, locator: "https://otexts.com/fpp3/"}]
