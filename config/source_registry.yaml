sources:
  - source_id: stats_gov_cn
    name: 国家数据
    region: china
    authority: national_statistics
    priority: 100
    kind: official_portal
    asset_classes: [macro, rates, real_estate, labor]
    data_types: [macro_timeseries, releases]
    access_methods: [api, official_download, browser, cdp, cached_snapshot]
    primary_method: api
    fallback_methods: [official_download, browser, cdp, cached_snapshot]
    point_in_time: true
    revision_aware: true
    authentication: {required: false, secret_env: null, status_required: false}
    access_policy: public
    browser_scraping: true
    roles: [primary, cross_check]
    parser: stats_gov_json
    normalizer: macro_timeseries_v1
    quality_checks: [timestamp_order, release_date, availability_date, missingness, revision_check]
    required_fields: [observation_date, release_date, availability_date, value, unit, frequency]
    base_urls: [https://data.stats.gov.cn/]
