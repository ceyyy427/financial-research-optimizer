  <rect width="1320" height="660" rx="28" fill="#F8FAFC"/><text x="64" y="58" class="s" letter-spacing="2">MODULE 06 / RESEARCH AGENTS</text><text x="64" y="104" class="h">多角色并行分析，统一进入可审计的研究计划</text>
