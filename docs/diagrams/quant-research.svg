  <g><rect x="255" y="190" width="165" height="130" rx="20" fill="#fff" stroke="#15803D" stroke-width="3"/><circle cx="297" cy="235" r="21" fill="#DCFCE7"/><path d="M285 224H309M285 233H305M285 242H309" stroke="#15803D" stroke-width="3" stroke-linecap="round"/><text x="331" y="241" class="t">数据审计</text><text x="275" y="279" class="s">样本 · 时间 · 质量</text></g>
