<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">量化研究流程</title>
  <desc id="desc">量化研究从问题和假设开始，经过数据审计、实验、指标、样本外检查和研究工件。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker><style>.t{font:700 19px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.s{font:500 13px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#64748B}.h{font:700 30px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.c{fill:none;stroke:#D97706;stroke-width:3;marker-end:url(#arrow)}.d{fill:none;stroke:#F59E0B;stroke-width:2.5;stroke-dasharray:8 8;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="560" rx="28" fill="#FFFBEB"/><text x="64" y="58" class="s" letter-spacing="2">MODULE 03 / QUANT RESEARCH</text><text x="64" y="104" class="h">先声明问题和数据，再读取指标</text>
