  <rect width="1280" height="600" rx="28" fill="#FFF7ED"/><text x="64" y="58" class="s" letter-spacing="2">MODULE 04 / FACTOR STRATEGY WORKBENCH</text><text x="64" y="104" class="h">因子从表达式走到可解释的策略证据</text>
