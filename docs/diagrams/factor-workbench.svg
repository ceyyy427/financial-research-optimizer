  <g><rect x="235" y="200" width="150" height="130" rx="18" fill="#fff" stroke="#EA580C" stroke-width="3"/><circle cx="272" cy="242" r="20" fill="#FFEDD5"/><path d="M260 233H284M260 242H284M260 251H284" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/><circle cx="267" cy="233" r="3" fill="#fff" stroke="#EA580C" stroke-width="2"/><circle cx="278" cy="242" r="3" fill="#fff" stroke="#EA580C" stroke-width="2"/><text x="301" y="248" class="t">因子 DSL</text><text x="253" y="285" class="s">受控算子</text></g>
