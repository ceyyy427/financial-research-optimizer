  <rect width="1200" height="560" rx="28" fill="#FAF9FF"/><text x="64" y="58" class="s" letter-spacing="2">MODULE 02 / KNOWLEDGE PATH</text><text x="64" y="104" class="h">让一个概念从“我有感觉”走到“我能复现”</text>
