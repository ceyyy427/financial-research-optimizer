<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">事件到证据流程</title>
  <desc id="desc">金融事件经过来源快照、主张拆分和证据核验，进入知识语境并保存为学习记录。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker><style>.t{font:700 22px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.s{font:500 14px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#64748B}.h{font:700 30px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.c{fill:none;stroke:#64748B;stroke-width:3;marker-end:url(#arrow)}.d{fill:none;stroke:#94A3B8;stroke-width:2.5;stroke-dasharray:8 8;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="560" rx="28" fill="#F8FAFC"/><text x="64" y="58" class="s" letter-spacing="2">MODULE 01 / EVENT → EVIDENCE</text><text x="64" y="104" class="h">先固定发生了什么，再解释它意味着什么</text>
  <path class="c" d="M245 255H285"/><path class="c" d="M510 255H550"/><path class="c" d="M775 255H815"/><path class="d" d="M925 340C925 450 650 470 450 350"/>
  <g><rect x="64" y="180" width="181" height="150" rx="20" fill="#fff" stroke="#2563EB" stroke-width="3"/><circle cx="105" cy="225" r="21" fill="#DBEAFE"/><circle cx="105" cy="225" r="9" fill="none" stroke="#2563EB" stroke-width="3"/><path d="M105 206V198M105 252V244M86 225H78M132 225H124" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/><text x="145" y="231" class="t">事件</text><text x="87" y="276" class="s">发布 · 日期 · 对象</text><text x="87" y="298" class="s">CAPTURED</text></g>
  <g><rect x="285" y="180" width="225" height="150" rx="20" fill="#fff" stroke="#0891B2" stroke-width="3"/><circle cx="326" cy="225" r="21" fill="#CFFAFE"/><rect x="315" y="210" width="22" height="29" rx="3" fill="none" stroke="#0891B2" stroke-width="3"/><path d="M320 218H332M320 225H332M320 232H328" stroke="#0891B2" stroke-width="2.5" stroke-linecap="round"/><text x="366" y="231" class="t">来源快照</text><text x="308" y="276" class="s">原始载荷 · 哈希</text><text x="308" y="298" class="s">时间点 · 版本</text></g>
  <g><rect x="550" y="180" width="225" height="150" rx="20" fill="#fff" stroke="#0891B2" stroke-width="3"/><circle cx="591" cy="225" r="21" fill="#CFFAFE"/><path d="M579 217H603M579 225H598M579 233H603" stroke="#0891B2" stroke-width="3" stroke-linecap="round"/><path d="M608 218L614 224L624 212" fill="none" stroke="#0891B2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="631" y="231" class="t">主张核验</text><text x="573" y="276" class="s">事实 · 解释 · 反证</text><text x="573" y="298" class="s">证据引用</text></g>
  <g><rect x="815" y="180" width="225" height="150" rx="20" fill="#fff" stroke="#7C3AED" stroke-width="3"/><circle cx="856" cy="225" r="21" fill="#EDE9FE"/><path d="M844 214C850 210 856 212 857 216V238C852 234 848 234 844 237ZM868 214C862 210 857 212 857 216V238C862 234 865 234 868 237Z" fill="none" stroke="#7C3AED" stroke-width="3"/><text x="896" y="231" class="t">知识语境</text><text x="838" y="276" class="s">概念 · 方程 · 应用</text><text x="838" y="298" class="s">可继续研究</text></g>
