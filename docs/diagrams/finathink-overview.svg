<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Finathink 研究总流程</title>
  <desc id="desc">从金融事件、证据和知识开始，经过数据、量化、因子和风控，生成研究报告并回到下一轮学习问题。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF2FF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#172033" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker>
    <style>
      .title{font:700 34px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}
      .eyebrow{font:700 13px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:2px;fill:#64748B}
      .label{font:700 18px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}
      .sub{font:500 13px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#64748B}
      .node{filter:url(#shadow)}
      .connector{fill:none;stroke:#64748B;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}
      .feedback{fill:none;stroke:#94A3B8;stroke-width:2.5;stroke-dasharray:8 8;stroke-linecap:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="720" rx="28" fill="url(#bg)"/>
  <text x="72" y="62" class="eyebrow">FINATHINK / RESEARCH OS</text>
  <text x="72" y="112" class="title">从一个事件，走完一条可追溯的研究链路</text>
  <text x="72" y="142" class="sub">每个模块都有明确输入、研究工件、颜色语义和下一步动作。</text>

  <path class="connector" d="M270 270H330"/><path class="connector" d="M560 270H620"/><path class="connector" d="M850 270H910"/>
  <path class="connector" d="M1030 355V435H910"/><path class="connector" d="M790 525H730"/><path class="connector" d="M500 525H440"/>
  <path class="connector" d="M210 525H150V355"/>
  <path class="feedback" d="M1040 575C1190 665 1275 625 1275 490C1275 405 1195 375 1090 375"/>

  <g class="node" data-module="event">
    <rect x="70" y="205" width="200" height="130" rx="22" fill="#fff" stroke="#2563EB" stroke-width="3"/>
    <rect x="70" y="205" width="9" height="130" rx="4" fill="#2563EB"/>
    <circle cx="112" cy="247" r="20" fill="#DBEAFE"/><circle cx="112" cy="247" r="9" fill="none" stroke="#2563EB" stroke-width="3"/><path d="M112 229V220M112 274V265M94 247H85M139 247H130" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
    <text x="145" y="253" class="label">金融事件</text><text x="95" y="292" class="sub">捕获 · 时间点 · 来源</text>
  </g>
  <g class="node" data-module="evidence">
    <rect x="330" y="205" width="230" height="130" rx="22" fill="#fff" stroke="#0891B2" stroke-width="3"/><rect x="330" y="205" width="9" height="130" rx="4" fill="#0891B2"/>
    <circle cx="372" cy="247" r="20" fill="#CFFAFE"/><rect x="361" y="232" width="21" height="28" rx="3" fill="none" stroke="#0891B2" stroke-width="3"/><path d="M366 268L372 274L384 261M366 240H377" fill="none" stroke="#0891B2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="405" y="253" class="label">证据与主张</text><text x="355" y="292" class="sub">引用 · 核验 · 数据指纹</text>
  </g>
  <g class="node" data-module="knowledge">
    <rect x="620" y="205" width="230" height="130" rx="22" fill="#fff" stroke="#7C3AED" stroke-width="3"/><rect x="620" y="205" width="9" height="130" rx="4" fill="#7C3AED"/>
    <circle cx="662" cy="247" r="20" fill="#EDE9FE"/><path d="M650 236C656 232 662 234 663 238V260C658 256 654 256 650 259ZM674 236C668 232 663 234 663 238V260C668 256 671 256 674 259Z" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linejoin="round"/>
    <text x="695" y="253" class="label">知识理解</text><text x="645" y="292" class="sub">直觉 · 方程 · 代码 · 应用</text>
  </g>
  <g class="node" data-module="data">
    <rect x="910" y="205" width="230" height="130" rx="22" fill="#fff" stroke="#15803D" stroke-width="3"/><rect x="910" y="205" width="9" height="130" rx="4" fill="#15803D"/>
    <circle cx="952" cy="247" r="20" fill="#DCFCE7"/><ellipse cx="952" cy="240" rx="12" ry="5" fill="none" stroke="#15803D" stroke-width="3"/><path d="M940 240V257C940 263 964 263 964 257V240M940 249C940 255 964 255 964 249" fill="none" stroke="#15803D" stroke-width="3"/>
    <text x="985" y="253" class="label">数据就绪</text><text x="935" y="292" class="sub">快照 · PIT · 血缘 · 质量</text>
  </g>
  <g class="node" data-module="quant">
    <rect x="910" y="435" width="230" height="130" rx="22" fill="#fff" stroke="#D97706" stroke-width="3"/><rect x="910" y="435" width="9" height="130" rx="4" fill="#D97706"/>
    <circle cx="952" cy="477" r="20" fill="#FEF3C7"/><path d="M940 489L948 480L954 484L965 469" fill="none" stroke="#D97706" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M940 493V462M940 493H967" stroke="#D97706" stroke-width="3" stroke-linecap="round"/>
    <text x="985" y="483" class="label">量化实验</text><text x="935" y="522" class="sub">假设 · 指标 · OOS · 工件</text>
  </g>
  <g class="node" data-module="factor">
    <rect x="660" y="435" width="230" height="130" rx="22" fill="#fff" stroke="#EA580C" stroke-width="3"/><rect x="660" y="435" width="9" height="130" rx="4" fill="#EA580C"/>
    <circle cx="702" cy="477" r="20" fill="#FFEDD5"/><path d="M690 468H714M690 477H714M690 486H714" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/><circle cx="697" cy="468" r="3" fill="#fff" stroke="#EA580C" stroke-width="2"/><circle cx="707" cy="477" r="3" fill="#fff" stroke="#EA580C" stroke-width="2"/><circle cx="699" cy="486" r="3" fill="#fff" stroke="#EA580C" stroke-width="2"/>
    <text x="735" y="483" class="label">因子研究</text><text x="685" y="522" class="sub">DSL · 候选 · IC · 衰减</text>
  </g>
  <g class="node" data-module="risk">
    <rect x="370" y="435" width="230" height="130" rx="22" fill="#fff" stroke="#DC2626" stroke-width="3"/><rect x="370" y="435" width="9" height="130" rx="4" fill="#DC2626"/>
    <circle cx="412" cy="477" r="20" fill="#FEE2E2"/><path d="M412 463L426 469V480C426 489 419 495 412 498C405 495 398 489 398 480V469Z" fill="none" stroke="#DC2626" stroke-width="3" stroke-linejoin="round"/><path d="M406 480L410 484L419 474" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="445" y="483" class="label">策略与风控</text><text x="395" y="522" class="sub">信号 · 仓位 · 门禁 · 成本</text>
  </g>
  <g class="node" data-module="report">
    <rect x="110" y="435" width="230" height="130" rx="22" fill="#334155" stroke="#334155" stroke-width="3"/><circle cx="152" cy="477" r="20" fill="#E2E8F0"/><rect x="142" y="463" width="20" height="28" rx="3" fill="none" stroke="#334155" stroke-width="3"/><path d="M147 472H157M147 479H157M147 486H154" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/><text x="185" y="483" class="label" style="fill:#fff">报告与学习</text><text x="135" y="522" class="sub" style="fill:#CBD5E1">HTML · 工作区 · 下一问</text>
  </g>
  <text x="1230" y="615" text-anchor="end" class="sub" fill="#64748B">虚线：把结果带回下一轮研究问题</text>
</svg>
